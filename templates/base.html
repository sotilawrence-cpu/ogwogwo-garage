<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogwogwo Bonoko Garage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar { background-color: #000000 !important; border-bottom: 2px solid #333; }
        .card { background-color: #262626; border: 1px solid #444; color: white; }
        .btn-primary { background-color: #007bff; border: none; }
        .btn-primary:hover { background-color: #0056b3; }
        footer { background-color: #000000; color: #aaa; }
        .social-link:hover { opacity: 0.8; transition: 0.3s; }
        /* Logo Scaling */
        .garage-logo { max-height: 60px; width: auto; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow-lg mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{{ url_for('static', filename='ogwogwo_web_logo.png') }}" alt="Ogwogwo Bonoko Garage Logo" class="garage-logo me-2">
                <span class="fw-bold text-uppercase tracking-wider d-none d-md-inline">Ogwogwo Bonoko</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link text-info fw-bold" href="/admin"><i class="bi bi-speedometer2"></i> Admin Panel</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-warning fw-bold text-dark" href="/booking">Book Now</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="mt-auto py-5 border-top border-secondary">
        <div class="container">
            <div class="row">
                <div class="col-md-4 mb-4">
                    <h5 class="text-white mb-3">OGWOGWO BONOKO GARAGE</h5>
                    <p class="mb-1"><i class="bi bi-telephone-fill text-warning me-2"></i> +254 712 201 770</p>
                    <p class="small text-muted">Open Sunday — Friday (08:00 - 18:00)</p>
                </div>
                <div class="col-md-4 mb-4">
                    <h5 class="text-white mb-3">Quick Links</h5>
                    <ul class="list-unstyled">
                        <li><a href="/" class="text-muted text-decoration-none small">Home</a></li>
                        <li><a href="/booking" class="text-muted text-decoration-none small">Services</a></li>
                        <li><a href="/admin" class="text-muted text-decoration-none small">Staff Portal</a></li>
                    </ul>
                </div>
                <div class="col-md-4 mb-4 text-md-end">
                    <h5 class="text-white mb-3">Follow Us</h5>
                    <div class="fs-4">
                        <a href="#" class="text-primary me-3 social-link"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="text-info me-3 social-link"><i class="bi bi-twitter-x"></i></a>
                        <a href="#" class="text-danger social-link"><i class="bi bi-instagram"></i></a>
                    </div>
                </div>
            </div>
            <hr class="border-secondary mt-4">
            <div class="text-center">
                <p class="small text-muted mb-0">&copy; 2026 Ogwogwo Bonoko Garage. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
