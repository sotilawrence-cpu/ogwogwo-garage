{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-lg p-4">
            <h2 class="text-center text-warning fw-bold mb-4">SERVICE BOOKING FORM</h2>
            <p class="text-center text-muted mb-4">Please provide your details below to schedule your vehicle service.</p>
            
            <form action="/booking" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-light">First Name</label>
                        <input type="text" name="first_name" class="form-control bg-dark text-white border-secondary" 
                               placeholder="e.g., Lawrence" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-light">Other Names</label>
                        <input type="text" name="other_names" class="form-control bg-dark text-white border-secondary" 
                               placeholder="e.g., Soti" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-light">Email Address</label>
                        <input type="email" name="email" class="form-control bg-dark text-white border-secondary" 
                               placeholder="e.g., name@example.com" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-light">Contact Number</label>
                        <input type="text" name="phone" class="form-control bg-dark text-white border-secondary" 
                               placeholder="e.g., +254 7XX XXX XXX" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-light">Vehicle Plate Number</label>
                        <input type="text" name="plate" class="form-control bg-dark text-white border-secondary" 
                               placeholder="e.g., KBA 123A" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-light">Preferred Date</label>
                        <input type="date" name="date" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-light">Service Requirements</label>
                    <textarea name="service" class="form-control bg-dark text-white border-secondary" rows="5" 
                              placeholder="Please give a brief description of the service required (e.g., Engine oil change, brake check, or weird noises in the gearbox)." required></textarea>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-warning btn-lg fw-bold">CONFIRM BOOKING</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
