{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 card p-4 shadow-lg">
        <h2 class="mb-4 text-center border-bottom pb-2 border-secondary">New Service Booking</h2>
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label text-muted">Customer Name</label>
                    <input type="text" name="name" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-muted">Phone Number</label>
                    <input type="text" name="phone" class="form-control bg-dark text-white border-secondary" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label text-muted">Vehicle Model</label>
                    <input type="text" name="vehicle" placeholder="e.g. Toyota Hilux" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-muted">License Plate</label>
                    <input type="text" name="plate" class="form-control bg-dark text-white border-secondary" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted">Service Required</label>
                <select name="service" class="form-select bg-dark text-white border-secondary">
                    <option value="Oil Change">Oil Change</option>
                    <option value="Engine Repair">Engine Repair</option>
                    <option value="Brake Check">Brake Check</option>
                    <option value="General Maintenance">General Maintenance</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label text-muted">Preferred Date (Sun-Fri)</label>
                <input type="date" name="date" id="repairDate" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted">Issue Details</label>
                <textarea name="issue" class="form-control bg-dark text-white border-secondary" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Confirm Booking</button>
        </form>
    </div>
</div>

<script>
    const picker = document.getElementById('repairDate');
    picker.addEventListener('input', function(e){
        var day = new Date(this.value).getUTCDay();
        if([6].includes(day)){
            e.preventDefault();
            this.value = '';
            alert('Your garage is closed on Saturdays. Please choose a day from Sunday to Friday.');
        }
    });
</script>
{% endblock %}
